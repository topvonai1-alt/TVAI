<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="TVAI Games Search - متصفح ألعاب آمن مع بحث ذكي">
    <title>TVAI Games Search | بحث آمن</title>

    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111118;
            --bg3: #161622;
            --card: #1a1a2e;
            --card-hover: #222236;
            --text: #e8e8f0;
            --text2: #b0b0c0;
            --text3: #707088;
            --accent: #00d4ff;
            --glow: rgba(0, 212, 255, 0.35);
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --border: #252535;
            --radius: 16px;
            --topbar: 50px;
            --tab: 42px;
            --sidebar: 270px;
            --font: 'Tajawal', sans-serif;
        }

        *{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;font-size:15px;}
        body{
            font-family:var(--font);background:var(--bg);color:var(--text);
            min-height:100dvh;overflow:hidden;user-select:none;
            background-image:radial-gradient(ellipse at 30% 50%, rgba(0,212,255,0.04) 0%, transparent 60%),
            radial-gradient(ellipse at 70% 20%, rgba(124,58,237,0.04) 0%, transparent 60%);
        }
        ::-webkit-scrollbar{width:5px;height:5px;}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

        /* container */
        .app{display:flex;height:100dvh;width:100%;position:relative}

        /* sidebar */
        .sidebar{
            width:var(--sidebar);min-width:var(--sidebar);background:var(--bg2);
            border-left:1px solid var(--border);display:flex;flex-direction:column;
            z-index:200;transition:0.3s ease;box-shadow:4px 0 25px rgba(0,0,0,0.4);
        }
        .sidebar.collapsed{transform:translateX(100%);min-width:0;width:0;overflow:hidden;border:none}
        .side-logo{padding:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
        .side-logo .icon{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;font-size:22px}
        .side-logo span{font-weight:800;font-size:1.2rem;background:linear-gradient(135deg,var(--accent),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .side-nav{flex:1;overflow-y:auto;padding:8px 12px}
        .nav-item{
            display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:12px;
            cursor:pointer;color:var(--text2);font-weight:500;border:1px solid transparent;
            margin-bottom:2px;transition:0.15s;font-size:0.95rem
        }
        .nav-item:hover{background:var(--bg3);color:#fff;border-color:var(--border)}
        .nav-item.active{background:var(--card);color:var(--accent);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}
        .nav-item .badge{background:var(--accent);color:#000;padding:2px 9px;border-radius:20px;font-size:0.7rem;margin-right:auto;font-weight:700}

        /* main */
        .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
        .topbar{
            height:var(--topbar);background:var(--bg2);border-bottom:1px solid var(--border);
            display:flex;align-items:center;padding:0 10px;gap:6px
        }
        .btn-icon{
            width:34px;height:34px;border-radius:8px;background:transparent;border:1px solid transparent;
            color:var(--text2);display:flex;align-items:center;justify-content:center;
            cursor:pointer;font-size:1.1rem;transition:0.15s
        }
        .btn-icon:hover{background:var(--bg3);color:#fff;border-color:var(--border)}
        .addr-wrap{flex:1;position:relative;display:flex;align-items:center;gap:6px}
        .addr{
            width:100%;height:36px;border-radius:22px;background:var(--bg3);border:2px solid var(--border);
            padding:0 40px 0 15px;color:var(--text);font-family:var(--font);font-size:0.85rem;
            text-align:left;direction:ltr
        }
        .addr:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
        .safe-tag{
            background:rgba(46,213,115,0.15);border:1px solid var(--success);border-radius:20px;
            padding:2px 12px;font-size:0.7rem;font-weight:600;color:var(--success);white-space:nowrap
        }

        .tab-bar{
            display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);
            height:var(--tab);overflow-x:auto;gap:2px;padding:0 6px
        }
        .tab{
            display:flex;align-items:center;gap:4px;padding:5px 14px;border-radius:10px 10px 0 0;
            cursor:pointer;font-size:0.82rem;color:var(--text3);white-space:nowrap;
            border:1px solid transparent;border-bottom:none;transition:0.15s;position:relative
        }
        .tab:hover{background:var(--bg3);color:#ddd}
        .tab.active{background:var(--bg);color:var(--accent);border-color:var(--border);font-weight:600}
        .tab.active::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2px;background:var(--accent);box-shadow:0 0 12px var(--glow)}
        .tab .close{width:18px;height:18px;border-radius:50%;opacity:0;background:transparent;border:none;color:inherit;cursor:pointer}
        .tab:hover .close,.tab.active .close{opacity:1}
        .tab .close:hover{background:var(--danger);color:#fff}
        .add-tab{width:30px;height:30px;border-radius:50%;border:1px dashed var(--border);color:var(--text3);margin:0 4px;cursor:pointer;display:grid;place-items:center}

        .content{flex:1;overflow:hidden;position:relative}
        .panel{position:absolute;inset:0;overflow-y:auto;padding:20px;display:none}
        .panel.active{display:block}
        .panel.iframe{padding:0}
        iframe{width:100%;height:100%;border:0}

        /* cards */
        .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));gap:16px}
        .card{
            background:var(--card);border-radius:var(--radius);overflow:hidden;
            cursor:pointer;transition:0.25s;border:1px solid var(--border);display:flex;flex-direction:column
        }
        .card:hover{transform:translateY(-6px);box-shadow:0 15px 35px rgba(0,0,0,0.6),0 0 30px var(--glow);border-color:var(--accent)}
        .card-img{aspect-ratio:16/10;background:var(--bg3);position:relative;overflow:hidden}
        .card-img img{width:100%;height:100%;object-fit:cover;transition:0.4s}
        .card:hover .card-img img{transform:scale(1.06)}
        .card-rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);padding:4px 10px;border-radius:20px;font-weight:700;color:var(--warning)}
        .card-body{padding:12px;display:flex;flex-direction:column;gap:4px}
        .card-body h3{font-size:0.95rem;font-weight:700;line-height:1.3}
        .card-body small{color:var(--text3)}
        .fav-btn{
            width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);
            color:var(--text3);margin-top:8px;cursor:pointer;display:grid;place-items:center;transition:0.2s
        }
        .fav-btn.favorited{background:var(--danger);border-color:var(--danger);color:#fff}

        .btn{
            display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:30px;
            font-weight:600;cursor:pointer;border:1px solid transparent;font-family:var(--font);font-size:0.9rem
        }
        .btn-primary{background:var(--accent);color:#000}
        .btn-outline{background:transparent;color:var(--accent);border-color:var(--accent)}

        /* ai chat panel inside tab */
        .ai-box{display:flex;flex-direction:column;height:100%;background:var(--bg2);border-radius:var(--radius);overflow:hidden;margin:-10px}
        .ai-header{padding:16px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px}
        .ai-dot{width:10px;height:10px;background:var(--success);border-radius:50%;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
        .ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
        .ai-msg{padding:10px 16px;border-radius:16px;max-width:85%;line-height:1.6;word-break:break-word}
        .ai-msg.user{background:var(--accent);color:#000;align-self:flex-end;border-radius:16px 16px 4px 16px}
        .ai-msg.bot{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-radius:16px 16px 16px 4px}
        .ai-input-box{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
        .ai-input{
            flex:1;padding:10px 16px;border-radius:25px;background:var(--bg3);border:1px solid var(--border);
            color:var(--text);font-family:var(--font);resize:none;min-height:42px
        }
        .ai-send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer}

        @media(max-width:768px){
            :root{--topbar:46px;--tab:38px}
            .sidebar{position:fixed;top:0;right:0;bottom:0;z-index:300;transform:translateX(100%);width:280px;min-width:280px}
            .sidebar.mobile-open{transform:translateX(0)}
            .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:299;display:none}
            .overlay.active{display:block}
            .grid{grid-template-columns:repeat(2,1fr);gap:10px}
            .panel{padding:12px}
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="side-logo"><div class="icon">🎮</div><span>TVAI Games</span></div>
        <nav class="side-nav">
            <div class="nav-item active" data-panel="trending">🔥 الأكثر رواجاً</div>
            <div class="nav-item" data-panel="search">🔍 بحث</div>
            <div class="nav-item" data-panel="favorites">❤️ المفضلة <span class="badge" id="favBadge" style="display:none">0</span></div>
            <div class="nav-item" data-panel="browser">🌐 المتصفح</div>
            <div class="nav-item" data-panel="ai-chat">🤖 مساعد الألعاب</div>
            <div style="border-top:1px solid var(--border);margin:8px 0"></div>
            <div class="nav-item" id="safeToggle">
                🛡️ البحث الآمن: <span id="safeLabel">صارم</span>
            </div>
        </nav>
    </aside>

    <div class="main">
        <div class="topbar">
            <button class="btn-icon" id="menuBtn">☰</button>
            <button class="btn-icon" id="backBtn" disabled="">←</button>
            <button class="btn-icon" id="fwdBtn" disabled="">→</button>
            <div class="addr-wrap">
                <input class="addr" id="addrBar" placeholder="🔍 ابحث عن لعبة أو اكتب رابط..." autocomplete="off">
                <span class="safe-tag">🔒 آمن</span>
            </div>
            <button class="btn-icon" id="goBtn">▶</button>
        </div>
        <div class="tab-bar" id="tabBar">
            <button class="add-tab" id="addTabBtn">+</button>
        </div>
        <div class="content" id="contentArea">
            <div class="panel active" id="panel-trending"><div class="grid" id="trendingGrid"></div></div>
            <div class="panel" id="panel-search"><div class="grid" id="searchResults"></div><div id="searchLoading" style="display:none;text-align:center;padding:30px">جاري البحث...</div></div>
            <div class="panel" id="panel-detail"><div id="detailContent"></div></div>
            <div class="panel iframe" id="panel-browser"><div id="iframeContainer" style="width:100%;height:100%"></div></div>
            <div class="panel" id="panel-favorites"><div class="grid" id="favGrid"></div></div>
            <div class="panel" id="panel-ai-chat">
                <div class="ai-box">
                    <div class="ai-header"><span class="ai-dot"></span> 🤖 تحدث مع مساعد الألعاب</div>
                    <div class="ai-msgs" id="aiMsgs"></div>
                    <div class="ai-input-box">
                        <textarea class="ai-input" id="aiInput" rows="1" placeholder="اسأل عن أي لعبة..."></textarea>
                        <button class="ai-send" id="aiSendBtn">▶</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div style="position:fixed;bottom:20px;left:20px;z-index:999" id="toastBox"></div>

<script>
    (() => {
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);
        const RAW_KEY = '7eb71de15a364738863b4b1f8b48a0a1';
        const AI_URL = 'https://idfrlfwewfgkkreooham.supabase.co/functions/v1/games-ai-api';
        const AI_AUTH = 'Bearer topvon_games_admin_1512d74cecacc5464bb8bc36222bc95bb98f9172160755a1';

        // ======== state ========
        const state = {
            tabs: [],
            activeTabId: null,
            counter: 0,
            favs: JSON.parse(localStorage.getItem('tvai_favs_v2') || '[]'),
            cache: {},
            history: {},
            histIdx: {},
            safeLevel: 'strict', // 'strict' (exclude Mature+), 'moderate' (exclude only Adults Only)
            aiStreaming: false,
            mobile: window.innerWidth <= 768,
        };

        // ======== safe filter ========
        const isSafe = (game) => {
            if (!game) return false;
            const ratingId = game.esrb_rating?.id;
            if (state.safeLevel === 'strict') {
                // exclude Mature (id=4) and Adults Only (id=5)
                return ratingId !== 4 && ratingId !== 5;
            } else if (state.safeLevel === 'moderate') {
                return ratingId !== 5;
            }
            return true; // off
        };

        // ======== tabs ========
        function createTab(panel, title, url = null) {
            state.counter++;
            const id = 't' + state.counter;
            const tab = { id, panel, title, url, gameId: null, searchQuery: null };
            state.tabs.push(tab);
            state.activeTabId = id;
            state.history[id] = url ? [url] : [];
            state.histIdx[id] = url ? 0 : -1;
            renderTabs();
            switchTab(id);
            return tab;
        }
        function closeTab(id) {
            const idx = state.tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            if (state.tabs.length === 1) {
                state.tabs = [];
                createTab('trending', '🔥 الأكثر رواجاً');
                return;
            }
            state.tabs.splice(idx, 1);
            delete state.history[id]; delete state.histIdx[id];
            if (state.activeTabId === id) {
                const newIdx = Math.min(idx, state.tabs.length - 1);
                state.activeTabId = state.tabs[newIdx].id;
                switchTab(state.activeTabId);
            }
            renderTabs();
        }
        function switchTab(id) {
            state.activeTabId = id;
            const tab = state.tabs.find(t => t.id === id);
            if (!tab) return;
            $$('.panel').forEach(p => p.classList.remove('active'));
            const panelEl = document.getElementById('panel-' + tab.panel);
            if (panelEl) panelEl.classList.add('active');
            document.getElementById('addrBar').value = tab.url || tab.searchQuery || '';
            if (tab.url && tab.panel === 'browser') loadIframe(tab.url, id, false);
            if (tab.panel === 'favorites') renderFavorites();
            updateNav(id);
            renderTabs();
            updateActiveNav(tab.panel);
        }
        function renderTabs() {
            const bar = $('#tabBar');
            bar.querySelectorAll('.tab').forEach(e => e.remove());
            state.tabs.forEach(t => {
                const el = document.createElement('div');
                el.className = 'tab' + (t.id === state.activeTabId ? ' active' : '');
                el.dataset.id = t.id;
                el.innerHTML = `<span>${escape(t.title)}</span><button class="close">✕</button>`;
                el.addEventListener('click', e => { if (!e.target.classList.contains('close')) switchTab(t.id); });
                el.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeTab(t.id); });
                bar.insertBefore(el, $('#addTabBtn'));
            });
        }
        function updateActiveNav(panel) {
            $$('.nav-item[data-panel]').forEach(i => i.classList.toggle('active', i.dataset.panel === panel));
        }
        function updateNav(tabId) {
            const h = state.history[tabId] || [], idx = state.histIdx[tabId] ?? -1;
            $('#backBtn').disabled = idx <= 0;
            $('#fwdBtn').disabled = idx >= h.length - 1;
        }
        function addHistory(tabId, url) {
            if (!state.history[tabId]) state.history[tabId] = [];
            const h = state.history[tabId];
            let idx = state.histIdx[tabId] ?? -1;
            if (idx < h.length - 1) h.splice(idx + 1);
            if (h[h.length - 1] !== url) {
                h.push(url);
                state.histIdx[tabId] = h.length - 1;
            }
            updateNav(tabId);
        }
        function loadIframe(url, tabId, addHist = true) {
            if (!url) return;
            let f = url.trim();
            if (!/^https?:\/\//i.test(f)) f = 'https://' + f;
            if (addHist) addHistory(tabId, f);
            const tab = state.tabs.find(t => t.id === tabId);
            if (tab) { tab.url = f; tab.title = extractDomain(f); renderTabs(); }
            const container = $('#iframeContainer');
            container.innerHTML = `<iframe src="${f}" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>`;
        }
        function extractDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); } catch { return url.substring(0, 25); }
        }
        function goBack() { /* implement if needed */ }
        function goForward() { /* implement */ }

        // ======== RAWG ========
        async function rawg(path, params = {}) {
            const url = new URL('https://api.rawg.io/api' + path);
            url.searchParams.set('key', RAW_KEY);
            url.searchParams.set('page_size', '20');
            Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== '') url.searchParams.set(k, v); });
            const key = url.toString();
            if (state.cache[key]) return state.cache[key];
            const res = await fetch(url);
            if (!res.ok) throw new Error('API error ' + res.status);
            const data = await res.json();
            state.cache[key] = data;
            setTimeout(() => delete state.cache[key], 5 * 60 * 1000);
            return data;
        }
        async function searchGames(q) {
            $('#searchLoading').style.display = 'block';
            $('#searchResults').innerHTML = '';
            try {
                const data = await rawg('/games', { search: q });
                return { ...data, results: (data.results || []).filter(isSafe) };
            } finally {
                $('#searchLoading').style.display = 'none';
            }
        }
        async function loadTrending() {
            try {
                let data = await rawg('/games/lists/main', { page_size: 20 });
                let games = (data.results || []).filter(isSafe);
                if (!games.length) {
                    data = await rawg('/games', { ordering: '-rating' });
                    games = (data.results || []).filter(isSafe);
                }
                renderCards(games, $('#trendingGrid'));
            } catch (e) {
                $('#trendingGrid').innerHTML = '<div style="text-align:center;padding:40px">تعذر التحميل</div>';
            }
        }
        function renderCards(games, container) {
            if (!games.length) {
                container.innerHTML = '<div style="text-align:center;padding:40px">😔 لا توجد نتائج (تم فلترة المحتوى غير الآمن)</div>';
                return;
            }
            container.innerHTML = games.map(g => {
                const fav = state.favs.includes(g.id);
                const r = g.rating?.toFixed(1) || '?';
                const img = g.background_image || '';
                const year = g.released ? new Date(g.released).getFullYear() : 'غير معروف';
                return `
                <div class="card" data-id="${g.id}">
                    <div class="card-img">${img ? `<img src="${img}" alt="">` : '🎮'}</div>
                    <div class="card-rating">⭐${r}</div>
                    <div class="card-body">
                        <h3>${escape(g.name)}</h3>
                        <small>📅 ${year}</small>
                        <button class="fav-btn ${fav ? 'favorited' : ''}" data-id="${g.id}">${fav ? '❤️' : '🤍'}</button>
                    </div>
                </div>`;
            }).join('');
            container.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', e => {
                    if (e.target.closest('.fav-btn')) return;
                    openDetail(+card.dataset.id);
                });
                card.querySelector('.fav-btn').addEventListener('click', e => {
                    e.stopPropagation();
                    toggleFav(+card.dataset.id, e.target);
                });
            });
        }
        async function openDetail(gameId) {
            const exist = state.tabs.find(t => t.panel === 'detail' && t.gameId === gameId);
            if (exist) { switchTab(exist.id); return; }
            const tab = createTab('detail', '🎮 تفاصيل');
            tab.gameId = gameId;
            renderTabs();
            await loadDetail(gameId, true);
        }
        async function loadDetail(gameId, updateTitle) {
            $('#detailContent').innerHTML = '<div style="padding:40px;text-align:center">تحميل...</div>';
            const g = await rawg('/games/' + gameId);
            if (!g) return;
            if (updateTitle) {
                const tab = state.tabs.find(t => t.id === state.activeTabId);
                if (tab) { tab.title = '🎮 ' + g.name; tab.gameId = gameId; renderTabs(); }
            }
            const fav = state.favs.includes(gameId);
            $('#detailContent').innerHTML = `
                <button class="btn btn-outline" onclick="window._backToTrend()">← العودة</button>
                <div style="background:var(--card);border-radius:var(--radius);overflow:hidden;margin-top:12px;">
                    ${g.background_image ? `<img src="${g.background_image}" style="width:100%;max-height:350px;object-fit:cover;">` : ''}
                    <div style="padding:20px">
                        <h2>${escape(g.name)}</h2>
                        <div style="display:flex;gap:20px;margin:12px 0;flex-wrap:wrap;">
                            <span>⭐ ${g.rating?.toFixed(1)||'?'}</span>
                            <span>📅 ${g.released||'?'}</span>
                            <span>📊 ${g.metacritic||'?'}</span>
                        </div>
                        <p style="color:var(--text2);line-height:1.8">${(g.description_raw||'').substring(0,400)}...</p>
                        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn btn-primary" id="favDetailBtn">${fav ? '❤️ محفوظة' : '🤍 أضف للمفضلة'}</button>
                            <button class="btn btn-outline" id="similarBtn">🔍 ألعاب مشابهة</button>
                            <button class="btn btn-outline" id="askAiBtn">🤖 اسأل AI</button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('favDetailBtn').addEventListener('click', () => toggleFav(gameId, document.getElementById('favDetailBtn')));
            document.getElementById('similarBtn').addEventListener('click', () => similarGames(gameId));
            document.getElementById('askAiBtn').addEventListener('click', () => askAiAboutGame(escape(g.name)));
        }
        function toggleFav(gameId, btn) {
            const idx = state.favs.indexOf(gameId);
            if (idx === -1) {
                state.favs.push(gameId);
                if (btn) { btn.classList.add('favorited'); btn.textContent = '❤️ محفوظة'; }
                toast('أضيف إلى المفضلة');
            } else {
                state.favs.splice(idx, 1);
                if (btn) { btn.classList.remove('favorited'); btn.textContent = '🤍 أضف للمفضلة'; }
                toast('أزيل من المفضلة');
            }
            localStorage.setItem('tvai_favs_v2', JSON.stringify(state.favs));
            updateFavBadge();
            if (state.tabs.find(t => t.id === state.activeTabId)?.panel === 'favorites') renderFavorites();
            // update any visible fav buttons for this game
            document.querySelectorAll(`.fav-btn[data-id="${gameId}"]`).forEach(b => {
                const isFav = state.favs.includes(gameId);
                b.classList.toggle('favorited', isFav);
                b.textContent = isFav ? '❤️' : '🤍';
            });
        }
        function updateFavBadge() {
            const badge = $('#favBadge');
            const count = state.favs.length;
            badge.style.display = count ? 'inline' : 'none';
            badge.textContent = count;
        }
        async function renderFavorites() {
            const grid = $('#favGrid');
            if (!state.favs.length) {
                grid.innerHTML = '<div style="text-align:center;padding:40px">💔 لا توجد ألعاب مفضلة</div>';
                return;
            }
            grid.innerHTML = '<div style="padding:40px;text-align:center">تحميل...</div>';
            const games = [];
            for (const id of state.favs) {
                try { const g = await rawg('/games/' + id); if (g) games.push(g); } catch {}
            }
            renderCards(games.filter(isSafe), grid);
        }
        async function similarGames(gameId) {
            const data = await rawg('/games/' + gameId + '/suggested', { page_size: 10 });
            if (data.results) {
                const games = data.results.filter(isSafe);
                renderCards(games, $('#searchResults'));
                const tab = state.tabs.find(t => t.id === state.activeTabId);
                if (tab) { tab.panel = 'search'; tab.searchQuery = 'ألعاب مشابهة'; renderTabs(); }
                $$('.panel').forEach(p => p.classList.remove('active'));
                $('#panel-search').classList.add('active');
                updateActiveNav('search');
            }
        }

        // ======== AI Chat ========
        async function sendAiMessage() {
            if (state.aiStreaming) return;
            const input = $('#aiInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            appendAiMsg(text, 'user');
            const botEl = appendAiMsg('', 'bot');
            state.aiStreaming = true;
            $('#aiSendBtn').disabled = true;
            try {
                const res = await fetch(AI_URL, {
                    method: 'POST',
                    headers: { 'Authorization': AI_AUTH, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, stream: true })
                });
                if (!res.ok) throw new Error('خطأ ' + res.status);
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let full = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    full += decoder.decode(value, { stream: true });
                    botEl.textContent = full;
                    $('#aiMsgs').scrollTop = $('#aiMsgs').scrollHeight;
                }
            } catch (e) {
                botEl.textContent = '⚠️ تعذر الاتصال. ' + e.message;
            } finally {
                state.aiStreaming = false;
                $('#aiSendBtn').disabled = false;
            }
        }
        function appendAiMsg(text, role) {
            const el = document.createElement('div');
            el.className = 'ai-msg ' + role;
            el.textContent = text;
            $('#aiMsgs').appendChild(el);
            $('#aiMsgs').scrollTop = $('#aiMsgs').scrollHeight;
            return el;
        }
        function askAiAboutGame(gameName) {
            const exist = state.tabs.find(t => t.panel === 'ai-chat');
            const tabId = exist ? exist.id : createTab('ai-chat', '🤖 AI').id;
            switchTab(tabId);
            $('#aiInput').value = 'أخبرني عن لعبة ' + gameName;
            sendAiMessage();
        }
        window._backToTrend = () => {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab) { tab.panel = 'trending'; tab.gameId = null; renderTabs(); }
            $$('.panel').forEach(p => p.classList.remove('active'));
            $('#panel-trending').classList.add('active');
            updateActiveNav('trending');
        };

        // ======== safe search toggle ========
        function cycleSafeLevel() {
            if (state.safeLevel === 'strict') state.safeLevel = 'moderate';
            else if (state.safeLevel === 'moderate') state.safeLevel = 'strict';
            document.getElementById('safeLabel').textContent = state.safeLevel === 'strict' ? 'صارم' : 'معتدل';
            toast('أصبح البحث الآمن: ' + (state.safeLevel === 'strict' ? 'صارم (بدون +17)' : 'معتدل (بدون للبالغين فقط)'));
            // refresh current views
            loadTrending();
            if (state.tabs.find(t => t.id === state.activeTabId)?.panel === 'search') {
                const q = document.getElementById('addrBar').value;
                if (q) searchGames(q).then(d => renderCards(d.results, $('#searchResults')));
            }
            if (state.tabs.find(t => t.id === state.activeTabId)?.panel === 'favorites') renderFavorites();
        }

        // ======== helpers ========
        function escape(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function toast(msg) {
            const t = document.createElement('div');
            t.style.cssText = 'background:var(--card);padding:10px 20px;border-radius:20px;margin-top:8px;border:1px solid var(--border);animation:slideIn 0.3s ease';
            t.textContent = msg;
            $('#toastBox').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ======== events ========
        function bindEvents() {
            $('#menuBtn').addEventListener('click', () => {
                if (state.mobile) {
                    $('#sidebar').classList.toggle('mobile-open');
                    $('#overlay').classList.toggle('active');
                }
            });
            $('#overlay').addEventListener('click', () => {
                $('#sidebar').classList.remove('mobile-open');
                $('#overlay').classList.remove('active');
            });
            $('#addrBar').addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleAddressSubmit();
                }
            });
            $('#goBtn').addEventListener('click', handleAddressSubmit);
            $('#addTabBtn').addEventListener('click', () => {
                createTab('search', '🔍 بحث');
                document.getElementById('addrBar').focus();
            });
            $$('.nav-item[data-panel]').forEach(item => item.addEventListener('click', () => {
                const panel = item.dataset.panel;
                if (panel === 'trending') { const ex = state.tabs.find(t => t.panel === 'trending'); if (ex) switchTab(ex.id); else createTab('trending', '🔥 رواج'); }
                else if (panel === 'search') { const ex = state.tabs.find(t => t.panel === 'search'); if (ex) switchTab(ex.id); else createTab('search', '🔍 بحث'); document.getElementById('addrBar').focus(); }
                else if (panel === 'favorites') { renderFavorites(); const ex = state.tabs.find(t => t.panel === 'favorites'); if (ex) switchTab(ex.id); else createTab('favorites', '❤️ مفضلة'); }
                else if (panel === 'browser') { const ex = state.tabs.find(t => t.panel === 'browser'); if (ex) switchTab(ex.id); else createTab('browser', '🌐 متصفح'); }
                else if (panel === 'ai-chat') { const ex = state.tabs.find(t => t.panel === 'ai-chat'); if (ex) switchTab(ex.id); else createTab('ai-chat', '🤖 AI'); }
                if (state.mobile) { $('#sidebar').classList.remove('mobile-open'); $('#overlay').classList.remove('active'); }
            }));
            $('#aiSendBtn').addEventListener('click', sendAiMessage);
            $('#aiInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAiMessage(); } });
            window.addEventListener('resize', () => { state.mobile = window.innerWidth <= 768; });
            $('#safeToggle').addEventListener('click', cycleSafeLevel);
        }

        async function handleAddressSubmit() {
            const val = document.getElementById('addrBar').value.trim();
            if (!val) return;
            if (/^(https?:\/\/|www\.).+\.\w{2,}/.test(val) && !val.includes(' ')) {
                const tab = state.tabs.find(t => t.id === state.activeTabId);
                if (tab && tab.panel === 'browser') loadIframe(val, tab.id);
                else {
                    const nt = createTab('browser', extractDomain(val), val);
                    loadIframe(val, nt.id);
                }
                return;
            }
            // game search
            const data = await searchGames(val);
            renderCards(data.results, $('#searchResults'));
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab) {
                tab.panel = 'search';
                tab.searchQuery = val;
                tab.title = '🔍 ' + val.substring(0, 20);
                renderTabs();
            }
            $$('.panel').forEach(p => p.classList.remove('active'));
            $('#panel-search').classList.add('active');
            updateActiveNav('search');
        }

        // ======== init ========
        createTab('trending', '🔥 الأكثر رواجاً');
        loadTrending();
        updateFavBadge();
        bindEvents();
    })();
</script>

</body></html>
